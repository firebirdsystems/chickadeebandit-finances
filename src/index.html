<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finances</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: var(--hub-font-size, 15px); }
    .app { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 8px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .tabs { display: flex; gap: 0; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    .tab { flex: 1; background: var(--card); color: var(--muted); border: none; padding: 8px 0; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--accent); color: var(--accent-fg); }
    .btn { background: var(--accent); color: var(--accent-fg); border: none; border-radius: 8px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }

    .budget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .budget-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color 0.15s; }
    .budget-card:hover { border-color: var(--accent); }
    .budget-card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
    .budget-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .budget-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .budget-period { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
    .progress-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .budget-amounts { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); }
    .budget-amounts .spent { color: var(--text); font-weight: 600; }
    .over-budget { color: #dc2626 !important; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 1rem; font-weight: 700; }

    .tx-list { display: flex; flex-direction: column; gap: 2px; }
    .tx-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.15s; }
    .tx-item:hover { border-color: var(--accent); }
    .tx-amount { font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
    .budget-badge { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; font-size: 0.72rem; color: var(--muted); }

    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty p { margin-bottom: 12px; }
    .load-error { margin-bottom: 16px; padding: 12px 14px; border: 1px solid #fecaca; border-radius: 8px; background: #fef2f2; color: #991b1b; }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--card); border-radius: 14px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .field input, .field select { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; background: var(--bg); color: var(--text); }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
    .modal-left { margin-right: auto; }

    .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-swatch.selected { border-color: var(--text); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>💰 Finances</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" id="newBudgetBtn">+ Budget</button>
      <button class="btn" id="newTxBtn">+ Transaction</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabBudgets">Budgets</button>
    <button class="tab" id="tabTransactions">Recent Transactions</button>
    <button class="tab" id="tabReceipts">Receipts</button>
  </div>
  <div class="load-error" id="loadError" role="alert" hidden>
    Finances could not be loaded. Please refresh and try again.
  </div>

  <div id="budgetView">
    <div id="budgetGrid" class="budget-grid"></div>
    <div id="txSection" style="display:none">
      <div class="section-header">
        <span class="section-title" id="txSectionTitle">Transactions</span>
        <button class="btn btn-outline" id="clearBudgetFilterBtn" style="font-size:0.75rem;padding:4px 10px">Show all</button>
      </div>
      <div id="budgetTxList" class="tx-list"></div>
    </div>
  </div>

  <div id="allTxView" style="display:none">
    <div class="section-header">
      <span class="section-title">Recent Transactions</span>
    </div>
    <div class="search-row" id="search-row" style="display:none">
      <input id="search" class="search-input" type="search" placeholder="Search transactions…" aria-label="Search transactions" />
    </div>
    <div id="allTxList" class="tx-list"></div>
  </div>

  <div id="receiptsView" style="display:none">
    <div class="section-header">
      <span class="section-title">Forwarded Receipts</span>
    </div>
    <div id="receiptsList" class="tx-list"></div>
  </div>
</div>

<!-- Budget modal -->
<div class="overlay" id="budgetOverlay" style="display:none">
  <div class="modal">
    <h2 id="budgetTitle">New Budget</h2>
    <div class="field"><label>Name *</label><input id="bName" type="text" maxlength="200" placeholder="e.g. Groceries" /></div>
    <div class="field">
      <label>Spending Limit ($) *</label>
      <input id="bLimit" type="number" min="0" max="10000000000" step="0.01" placeholder="500.00" />
    </div>
    <div class="field">
      <label>Period</label>
      <select id="bPeriod">
        <option value="monthly">Monthly</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <div class="modal-left">
        <button class="btn btn-danger" id="budgetDeleteBtn" style="display:none">Delete</button>
      </div>
      <button class="btn btn-outline" id="budgetCancelBtn">Cancel</button>
      <button class="btn" id="budgetSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Transaction modal -->
<div class="overlay" id="txOverlay" style="display:none">
  <div class="modal">
    <h2 id="txTitle">New Transaction</h2>
    <div class="field">
      <label>Amount ($) *</label>
      <input id="tAmount" type="number" min="0.01" max="10000000000" step="0.01" placeholder="24.99" />
    </div>
    <div class="field"><label>Description *</label><input id="tDesc" type="text" maxlength="500" placeholder="e.g. Weekly grocery run" /></div>
    <div class="field"><label>Date *</label><input id="tDate" type="date" /></div>
    <div class="field">
      <label>Budget</label>
      <select id="tBudget">
        <option value="">— Uncategorized —</option>
      </select>
    </div>
    <div class="modal-actions">
      <div class="modal-left">
        <button class="btn btn-danger" id="txDeleteBtn" style="display:none">Delete</button>
      </div>
      <button class="btn btn-outline" id="txCancelBtn">Cancel</button>
      <button class="btn" id="txSaveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module">
import {
  COLORS,
  currentPeriodBounds,
  dollarsToCents,
  isValidDateString,
  normalizeColor, searchableFields,
} from './logic.js';
import { hubAlert, searchMatch } from '/hub-sdk.js';

const DB = window.__DB_URL ?? '';
const FILES = window.__FILES_URL ?? '';

let budgets      = [];
let transactions = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
let receipts     = [];
let receiptsLoaded = false;
let budgetSpent  = new Map();
let activeTab    = 'budgets';
let selectedBudgetId = null;
let editingBudgetId  = null;
let editingTxId      = null;
let selectedColor    = COLORS[0];

/* ── DB helper ─────────────────────────────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql, params }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `DB error ${res.status}`);
  return body;
}

/* ── Data loading ──────────────────────────────────────────────────────────── */
function summaryQuery() {
  const monthly = currentPeriodBounds('monthly');
  const weekly = currentPeriodBounds('weekly');
  return {
    sql: `
      SELECT b.id AS budget_id, COALESCE(SUM(t.amount_cents), 0) AS spent_cents
      FROM app_finances__budgets b
      LEFT JOIN app_finances__transactions t
        ON t.budget_id = b.id
       AND (
         (b.period = 'monthly' AND t.date >= ? AND t.date < ?)
         OR
         (b.period = 'weekly' AND t.date >= ? AND t.date < ?)
       )
      GROUP BY b.id
    `,
    params: [monthly.start, monthly.end, weekly.start, weekly.end],
  };
}

function applySummaryRows(rows) {
  budgetSpent = new Map(rows.map(row => [row.budget_id, Number(row.spent_cents) || 0]));
}

async function loadBudgetSummaries() {
  const query = summaryQuery();
  const result = await db(query.sql, query.params);
  applySummaryRows(result.rows ?? []);
}

async function loadRecentTransactions() {
  const result = await db(
    'SELECT id, budget_id, amount_cents, description, date FROM app_finances__transactions ORDER BY date DESC, id DESC LIMIT 250',
  );
  transactions = result.rows ?? [];
}

async function loadAll() {
  const query = summaryQuery();
  const [bRes, tRes, sRes] = await Promise.all([
    db('SELECT id, name, limit_cents, period, color FROM app_finances__budgets'),
    db('SELECT id, budget_id, amount_cents, description, date FROM app_finances__transactions ORDER BY date DESC, id DESC LIMIT 250'),
    db(query.sql, query.params),
  ]);
  budgets      = (bRes.rows ?? []).sort((a, b) => a.name.localeCompare(b.name));
  transactions = tRes.rows ?? [];
  applySummaryRows(sRes.rows ?? []);
}

/* ── Computed summaries ─────────────────────────────────────────────────────── */
function budgetSummary(budget) {
  const spent = budgetSpent.get(budget.id) ?? 0;
  const pct   = budget.limit_cents > 0 ? Math.min(spent / budget.limit_cents, 1) : (spent > 0 ? 1 : 0);
  return { spent, remaining: budget.limit_cents - spent, pct };
}

function fmtMoney(cents) {
  return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function budgetName(id) {
  return budgets.find(b => b.id === id)?.name ?? 'Uncategorized';
}

/* ── Rendering ─────────────────────────────────────────────────────────────── */
function renderBudgets() {
  const grid = document.getElementById('budgetGrid');
  grid.replaceChildren();
  if (!budgets.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.gridColumn = '1 / -1';
    const message = document.createElement('p');
    message.textContent = 'No budgets yet.';
    const button = document.createElement('button');
    button.className = 'btn';
    button.textContent = 'Create your first budget';
    button.addEventListener('click', () => openBudgetForm());
    empty.append(message, button);
    grid.append(empty);
    hideTxSection();
    return;
  }

  for (const b of budgets) {
    const { spent, remaining, pct } = budgetSummary(b);
    const over  = spent > b.limit_cents;
    const color = normalizeColor(b.color);
    const sel   = selectedBudgetId === b.id;

    const card = document.createElement('div');
    card.className = `budget-card${sel ? ' selected' : ''}`;
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.addEventListener('click', () => selectBudget(b.id));
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectBudget(b.id);
      }
    });

    const name = document.createElement('div');
    name.className = 'budget-name';
    const dot = document.createElement('span');
    dot.className = 'budget-dot';
    dot.style.backgroundColor = color;
    name.append(dot, document.createTextNode(b.name));

    const period = document.createElement('div');
    period.className = 'budget-period';
    period.textContent = b.period === 'weekly' ? 'Weekly' : 'Monthly';

    const progress = document.createElement('div');
    progress.className = 'progress-bar';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = `${(pct * 100).toFixed(1)}%`;
    fill.style.backgroundColor = over ? '#ef4444' : color;
    progress.append(fill);

    const amounts = document.createElement('div');
    amounts.className = 'budget-amounts';
    const spentText = document.createElement('span');
    spentText.className = `spent${over ? ' over-budget' : ''}`;
    spentText.textContent = `${fmtMoney(spent)} spent`;
    const remainingText = document.createElement('span');
    if (over) remainingText.className = 'over-budget';
    remainingText.textContent = over
      ? `${fmtMoney(Math.abs(remaining))} over`
      : `${fmtMoney(remaining)} left`;
    amounts.append(spentText, remainingText);

    card.append(name, period, progress, amounts);
    grid.append(card);
  }

  if (selectedBudgetId) renderBudgetTransactions();
  else hideTxSection();
}

function selectBudget(id) {
  selectedBudgetId = selectedBudgetId === id ? null : id;
  renderBudgets();
}

function clearBudgetFilter() {
  selectedBudgetId = null;
  renderBudgets();
}

function hideTxSection() {
  document.getElementById('txSection').style.display = 'none';
}

function renderBudgetTransactions() {
  const section = document.getElementById('txSection');
  const budget  = budgets.find(b => b.id === selectedBudgetId);
  if (!budget) { hideTxSection(); return; }

  section.style.display = '';
  document.getElementById('txSectionTitle').textContent = `${budget.name} — Recent Transactions`;
  const txs = transactions.filter(t => t.budget_id === selectedBudgetId);
  renderTxList('budgetTxList', txs);
}

function renderAllTransactions() {
  // Only worth offering the box once there is a ledger to search.
  const searchRow = document.getElementById('search-row');
  if (searchRow) searchRow.style.display = transactions.length ? '' : 'none';

  const shown = searchQ
    ? transactions.filter(t => searchMatch(searchQ, searchableFields(t, budgetNameFor(t.budget_id))))
    : transactions;
  renderTxList('allTxList', shown, !!searchQ);
}

function budgetNameFor(budgetId) {
  return budgets.find(b => b.id === budgetId)?.name ?? "";
}

// Only the ledger is redrawn on each keystroke, so the box keeps focus.
document.addEventListener('input', (e) => {
  if (e.target.id !== 'search') return;
  searchQ = e.target.value;
  renderAllTransactions();
});

function renderTxList(containerId, txs, filtered = false) {
  const el = document.getElementById(containerId);
  el.replaceChildren();
  if (!txs.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const message = document.createElement('p');
    message.textContent = filtered ? 'No transactions match that search.' : 'No transactions yet.';
    empty.append(message);
    el.append(empty);
    return;
  }
  for (const t of txs) {
    const item = document.createElement('div');
    item.className = 'tx-item';
    item.addEventListener('click', () => openTxForm(t.id));

    const amount = document.createElement('div');
    amount.className = 'tx-amount';
    amount.textContent = fmtMoney(t.amount_cents);

    const info = document.createElement('div');
    info.className = 'tx-info';
    const description = document.createElement('div');
    description.className = 'tx-desc';
    description.textContent = t.description;
    const meta = document.createElement('div');
    meta.className = 'tx-meta';
    meta.append(document.createTextNode(t.date));
    if (t.budget_id) {
      meta.append(document.createTextNode(' · '));
      const badge = document.createElement('span');
      badge.className = 'budget-badge';
      badge.textContent = budgetName(t.budget_id);
      meta.append(badge);
    }
    info.append(description, meta);
    item.append(amount, info);
    el.append(item);
  }
}

/* ── Receipts (forwarded via email-in "+receipts") ─────────────────────────── */
async function loadReceipts() {
  const res = await db(
    'SELECT id, file_id, filename, note, received_at FROM app_finances__receipts ORDER BY received_at DESC, id DESC LIMIT 250',
  );
  receipts = res.rows ?? [];
  receiptsLoaded = true;
}

function renderReceipts() {
  const el = document.getElementById('receiptsList');
  el.replaceChildren();
  if (!receipts.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const message = document.createElement('p');
    message.textContent = 'No receipts yet. Forward a receipt to your household inbox address with a +receipts tag.';
    empty.append(message);
    el.append(empty);
    return;
  }
  for (const r of receipts) {
    const item = document.createElement('div');
    item.className = 'tx-item';

    const info = document.createElement('div');
    info.className = 'tx-info';
    const desc = document.createElement('div');
    desc.className = 'tx-desc';
    desc.textContent = r.note || r.filename;
    const meta = document.createElement('div');
    meta.className = 'tx-meta';
    meta.textContent = (r.received_at || '').slice(0, 10);
    info.append(desc, meta);

    item.append(info);
    if (FILES && r.file_id) {
      const link = document.createElement('a');
      link.className = 'budget-badge';
      link.textContent = 'Download';
      link.href = `${FILES}/${r.file_id}`;
      link.target = '_blank';
      link.rel = 'noopener';
      item.append(link);
    }
    el.append(item);
  }
}

function render() {
  if (activeTab === 'budgets') {
    renderBudgets();
  } else if (activeTab === 'receipts') {
    renderReceipts();
  } else {
    renderAllTransactions();
  }
}

/* ── Tab switching ─────────────────────────────────────────────────────────── */
function setTab(tab) {
  activeTab = tab;
  document.getElementById('tabBudgets').classList.toggle('active', tab === 'budgets');
  document.getElementById('tabTransactions').classList.toggle('active', tab === 'transactions');
  document.getElementById('tabReceipts').classList.toggle('active', tab === 'receipts');
  document.getElementById('budgetView').style.display    = tab === 'budgets' ? '' : 'none';
  document.getElementById('allTxView').style.display     = tab === 'transactions' ? '' : 'none';
  document.getElementById('receiptsView').style.display  = tab === 'receipts' ? '' : 'none';
  if (tab === 'receipts' && !receiptsLoaded) {
    loadReceipts().then(render).catch(() => {});
  }
  render();
}

/* ── Budget form ───────────────────────────────────────────────────────────── */
function renderColorPicker() {
  const row = document.getElementById('colorRow');
  row.replaceChildren();
  for (const color of COLORS) {
    const swatch = document.createElement('button');
    swatch.type = 'button';
    swatch.className = `color-swatch${selectedColor === color ? ' selected' : ''}`;
    swatch.style.backgroundColor = color;
    swatch.setAttribute('aria-label', `Use color ${color}`);
    swatch.addEventListener('click', () => pickColor(color));
    row.append(swatch);
  }
}

function pickColor(c) { selectedColor = normalizeColor(c); renderColorPicker(); }

function openBudgetForm(id) {
  editingBudgetId = id || null;
  const b = id ? budgets.find(x => x.id === id) : null;
  document.getElementById('budgetTitle').textContent = b ? 'Edit Budget' : 'New Budget';
  document.getElementById('bName').value   = b?.name ?? '';
  document.getElementById('bLimit').value  = b ? (b.limit_cents / 100).toFixed(2) : '';
  document.getElementById('bPeriod').value = b?.period ?? 'monthly';
  selectedColor = normalizeColor(b?.color);
  renderColorPicker();
  document.getElementById('budgetDeleteBtn').style.display = b ? '' : 'none';
  document.getElementById('budgetOverlay').style.display = 'flex';
  document.getElementById('bName').focus();
}

function closeBudgetForm() {
  document.getElementById('budgetOverlay').style.display = 'none';
  editingBudgetId = null;
}

async function saveBudget() {
  const name  = document.getElementById('bName').value.trim();
  const limitCents = dollarsToCents(document.getElementById('bLimit').value, { allowZero: true });
  if (!name || name.length > 200 || limitCents === null) {
    hubAlert('Enter a name and a spending limit between $0 and $10 billion.');
    return;
  }
  const period     = document.getElementById('bPeriod').value;
  if (!['monthly', 'weekly'].includes(period)) {
    hubAlert('Choose a valid budget period.');
    return;
  }

  try {
    if (editingBudgetId) {
      await db('UPDATE app_finances__budgets SET name=?, limit_cents=?, period=?, color=? WHERE id=?',
        [name, limitCents, period, selectedColor, editingBudgetId]);
      budgets = budgets.map(b => b.id === editingBudgetId
        ? { ...b, name, limit_cents: limitCents, period, color: selectedColor } : b);
    } else {
      const id = crypto.randomUUID();
      await db('INSERT INTO app_finances__budgets (id, name, limit_cents, period, color) VALUES (?,?,?,?,?)',
        [id, name, limitCents, period, selectedColor]);
      budgets = [...budgets, {
        id,
        name,
        limit_cents: limitCents,
        period,
        color: selectedColor,
      }];
    }

    budgets.sort((a, b) => a.name.localeCompare(b.name));
    await loadBudgetSummaries();
    closeBudgetForm();
    render();
  } catch (error) {
    console.error('Failed to save budget:', error);
    hubAlert('The budget could not be saved. Please try again.');
  }
}

async function deleteBudget() {
  if (!editingBudgetId) return;
  if (!confirm('Delete this budget? Its transactions will become uncategorized.')) return;
  const id = editingBudgetId;
  try {
    await db('DELETE FROM app_finances__budgets WHERE id=?', [id]);
    budgets      = budgets.filter(b => b.id !== id);
    budgetSpent.delete(id);
    transactions = transactions.map(t => t.budget_id === id ? { ...t, budget_id: null } : t);
    if (selectedBudgetId === id) selectedBudgetId = null;
    closeBudgetForm();
    render();
  } catch (error) {
    console.error('Failed to delete budget:', error);
    hubAlert('The budget could not be deleted. Please try again.');
  }
}

/* ── Transaction form ──────────────────────────────────────────────────────── */
function openTxForm(id) {
  editingTxId = id || null;
  const t = id ? transactions.find(x => x.id === id) : null;
  document.getElementById('txTitle').textContent = t ? 'Edit Transaction' : 'New Transaction';
  document.getElementById('tAmount').value = t ? (t.amount_cents / 100).toFixed(2) : '';
  document.getElementById('tDesc').value   = t?.description ?? '';
  document.getElementById('tDate').value   = t?.date ?? new Date().toISOString().slice(0, 10);

  const sel = document.getElementById('tBudget');
  sel.replaceChildren(new Option('— Uncategorized —', ''));
  for (const budget of budgets) {
    sel.add(new Option(budget.name, budget.id, false, t?.budget_id === budget.id));
  }
  if (!t && selectedBudgetId) sel.value = selectedBudgetId;

  document.getElementById('txDeleteBtn').style.display = t ? '' : 'none';
  document.getElementById('txOverlay').style.display = 'flex';
  document.getElementById('tAmount').focus();
}

function closeTxForm() {
  document.getElementById('txOverlay').style.display = 'none';
  editingTxId = null;
}

async function saveTransaction() {
  const amountCents = dollarsToCents(document.getElementById('tAmount').value);
  const desc   = document.getElementById('tDesc').value.trim();
  const date   = document.getElementById('tDate').value;
  if (amountCents === null || !desc || desc.length > 500 || !isValidDateString(date)) {
    hubAlert('Enter an amount greater than $0, a description, and a valid date.');
    return;
  }
  const budgetId    = document.getElementById('tBudget').value || null;
  if (budgetId && !budgets.some(budget => budget.id === budgetId)) {
    hubAlert('Choose a valid budget.');
    return;
  }

  try {
    if (editingTxId) {
      await db('UPDATE app_finances__transactions SET amount_cents=?, description=?, date=?, budget_id=? WHERE id=?',
        [amountCents, desc, date, budgetId, editingTxId]);
    } else {
      const id = crypto.randomUUID();
      await db('INSERT INTO app_finances__transactions (id, budget_id, amount_cents, description, date) VALUES (?,?,?,?,?)',
        [id, budgetId, amountCents, desc, date]);
    }

    await Promise.all([loadRecentTransactions(), loadBudgetSummaries()]);
    closeTxForm();
    render();
  } catch (error) {
    console.error('Failed to save transaction:', error);
    hubAlert('The transaction could not be saved. Please try again.');
  }
}

async function deleteTransaction() {
  if (!editingTxId) return;
  if (!confirm('Delete this transaction?')) return;
  const id = editingTxId;
  try {
    await db('DELETE FROM app_finances__transactions WHERE id=?', [id]);
    await Promise.all([loadRecentTransactions(), loadBudgetSummaries()]);
    closeTxForm();
    render();
  } catch (error) {
    console.error('Failed to delete transaction:', error);
    hubAlert('The transaction could not be deleted. Please try again.');
  }
}

/* ── Init ──────────────────────────────────────────────────────────────────── */
async function init() {
  try {
    await loadAll();
  } catch (e) {
    console.error('Failed to load finances:', e);
    document.getElementById('loadError').hidden = false;
    return;
  }
  render();
}

function setupEventHandlers() {
  document.getElementById('newBudgetBtn').addEventListener('click', () => openBudgetForm());
  document.getElementById('newTxBtn').addEventListener('click', () => openTxForm());
  document.getElementById('tabBudgets').addEventListener('click', () => setTab('budgets'));
  document.getElementById('tabTransactions').addEventListener('click', () => setTab('transactions'));
  document.getElementById('tabReceipts').addEventListener('click', () => setTab('receipts'));
  document.getElementById('clearBudgetFilterBtn').addEventListener('click', clearBudgetFilter);
  document.getElementById('budgetDeleteBtn').addEventListener('click', deleteBudget);
  document.getElementById('budgetCancelBtn').addEventListener('click', closeBudgetForm);
  document.getElementById('budgetSaveBtn').addEventListener('click', saveBudget);
  document.getElementById('txDeleteBtn').addEventListener('click', deleteTransaction);
  document.getElementById('txCancelBtn').addEventListener('click', closeTxForm);
  document.getElementById('txSaveBtn').addEventListener('click', saveTransaction);
  document.getElementById('budgetOverlay').addEventListener('click', event => {
    if (event.target === event.currentTarget) closeBudgetForm();
  });
  document.getElementById('txOverlay').addEventListener('click', event => {
    if (event.target === event.currentTarget) closeTxForm();
  });
}

setupEventHandlers();
init();
</script>
</body>
